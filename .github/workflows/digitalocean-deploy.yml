name: DigitalOcean Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: digitalocean-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    outputs:
      artifact-id: ${{ steps.upload-frontend.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Check backend syntax
        shell: bash
        run: find backend/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install quotation PDF browser
        run: node backend/node_modules/puppeteer/lib/cjs/puppeteer/node/cli.js browsers install chrome

      - name: Test paginated directory APIs
        working-directory: backend
        run: node --test test/directoryServerPagination.test.js test/crmRedisCache.test.js test/crmCacheInvalidation.test.js test/crmFreshness.test.js test/slowPageReadModels.test.js test/slowPageLoading.test.js test/fastApprovalReads.test.js test/authDatabaseFailure.test.js test/staffLicenses.test.js test/quotationDeliveryAndExports.test.js test/quotationDocumentRendering.test.js test/proofDropzoneBrowser.test.js test/dataReceiptTracking.test.js test/receiptTrackerBrowser.test.js test/staffEmailProofUpload.test.js test/purchaseEmailProof.test.js test/arProofAccess.test.js test/emailProofSanitizer.test.js test/purchaseDataWorkflow.test.js test/salesDataWorkflow.test.js ../frontend/test/droppedProofFiles.test.mjs test/leadOwnershipAndEmailWorkflow.test.js ../frontend/test/exportReasonAllRoles.test.mjs ../frontend/test/licenseRemembering.test.mjs test/clientMasterDiscoveryClosure.test.js test/clientMasterClosedLeadEligibility.test.js test/userContactNumber.test.js test/pendingLeadsMonthEnd.test.js test/loadingBottlenecks.test.js test/dashboardDataFetch.test.js test/reportPayloadPerformance.test.js test/leadRevenue.test.js test/salesRepSummary.test.js test/leadRevenueSchema.test.js test/revenueAmount.test.js test/trafficSources.test.js test/coldLeadEdit.test.js test/temporaryLeads.test.js test/addServicesSubmitFlow.test.js test/consentExpiryReminders.test.js ../frontend/test/consentValidity.test.mjs

      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build --prefix frontend

      - name: Package verified frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s frontend/dist/index.html
          tar --create --gzip --file frontend-dist.tgz --directory frontend/dist .
          test -s frontend-dist.tgz

      - name: Upload frontend artifact
        id: upload-frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: |
            frontend-dist.tgz
            scripts/deploy-production.sh
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_SHA: ${{ github.sha }}
      DO_HOST: ${{ secrets.DO_HOST }}
      DO_USER: ${{ secrets.DO_USER }}
      DO_PORT: ${{ secrets.DO_PORT }}
      DO_SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
      DO_SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
      APP_DIR: ${{ vars.DO_APP_DIR }}
      PM2_APP_NAME: ${{ vars.DO_PM2_APP_NAME }}
      PUBLIC_URL: ${{ vars.DO_PUBLIC_URL }}
    steps:
      - name: Download verified frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: deployment-artifact

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=()
          for name in DO_HOST DO_USER DO_SSH_PRIVATE_KEY DO_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi
          test -s deployment-artifact/frontend-dist.tgz
          test -s deployment-artifact/scripts/deploy-production.sh

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DO_SSH_PRIVATE_KEY" > "$HOME/.ssh/digitalocean_deploy"
          chmod 600 "$HOME/.ssh/digitalocean_deploy"
          printf '%s\n' "$DO_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify SSH connectivity
        timeout-minutes: 4
        shell: bash
        run: |
          set -Eeuo pipefail
          port="${DO_PORT:-22}"
          ssh_options=(
            -i "$HOME/.ssh/digitalocean_deploy"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -p "$port"
          )

          for attempt in 1 2 3 4; do
            if ssh "${ssh_options[@]}" "$DO_USER@$DO_HOST" true; then
              echo "SSH connectivity verified on attempt $attempt."
              exit 0
            fi
            if [[ "$attempt" -lt 4 ]]; then
              delay=$((attempt * 10))
              echo "::warning::SSH connectivity attempt $attempt failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done

          echo "::error::Unable to reach the deployment server over SSH after four attempts. Verify the DO_HOST and DO_PORT production secrets and ensure the Droplet/cloud firewall permits SSH from GitHub-hosted runners."
          exit 1

      - name: Transfer verified frontend artifact
        timeout-minutes: 8
        shell: bash
        run: |
          set -Eeuo pipefail
          port="${DO_PORT:-22}"
          remote_artifact="/tmp/crm-frontend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tgz"
          remote_deploy_script="/tmp/crm-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          artifact_sha="$(sha256sum deployment-artifact/frontend-dist.tgz | awk '{print $1}')"

          ssh_options=(
            -i "$HOME/.ssh/digitalocean_deploy"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=30
            -o ConnectionAttempts=2
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -p "$port"
          )
          scp_options=(
            -i "$HOME/.ssh/digitalocean_deploy"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=30
            -o ConnectionAttempts=2
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -P "$port"
          )

          retry() {
            local attempt status
            for attempt in 1 2 3; do
              set +e
              "$@"
              status=$?
              set -e
              if [[ "$status" -eq 0 ]]; then return 0; fi
              if [[ "$attempt" -lt 3 ]]; then
                echo "::warning::Transfer command failed on attempt $attempt; retrying in $((attempt * 10))s."
                sleep $((attempt * 10))
              fi
            done
            return "$status"
          }

          printf -v driver_command 'umask 077; cat > %q' "$remote_deploy_script"
          for attempt in 1 2 3; do
            if ssh "${ssh_options[@]}" "$DO_USER@$DO_HOST" "$driver_command" < deployment-artifact/scripts/deploy-production.sh; then break; fi
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            echo "::warning::Deploy-script transfer failed on attempt $attempt; retrying in $((attempt * 10))s."
            sleep $((attempt * 10))
          done

          # actions/download-artifact already extracted the verified workflow
          # artifact on this runner. Copy the exact packaged frontend archive
          # over the authenticated SSH channel; the deploy script verifies its
          # SHA-256 before using it. This avoids requiring unzip on the Droplet.
          retry scp "${scp_options[@]}" \
            deployment-artifact/frontend-dist.tgz \
            "$DO_USER@$DO_HOST:$remote_artifact"

          printf -v verify_command 'umask 077; test -s %q && test -s %q && chmod 600 %q %q' \
            "$remote_artifact" "$remote_deploy_script" "$remote_artifact" "$remote_deploy_script"
          retry ssh "${ssh_options[@]}" "$DO_USER@$DO_HOST" "$verify_command"

          echo "REMOTE_FRONTEND_ARTIFACT=$remote_artifact" >> "$GITHUB_ENV"
          echo "REMOTE_DEPLOY_SCRIPT=$remote_deploy_script" >> "$GITHUB_ENV"
          echo "FRONTEND_ARTIFACT_SHA256=$artifact_sha" >> "$GITHUB_ENV"

      - name: Deploy verified commit and frontend artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          port="${DO_PORT:-22}"
          app_dir="${APP_DIR:-/var/www/CRMANANTTATTVA}"
          pm2_app="${PM2_APP_NAME:-crm-backend}"
          public_url="${PUBLIC_URL:-https://crmananttattva.com}"

          printf -v remote_command \
            'cd %q && bash %q %q %q %q %q %q %q true' \
            "$app_dir" "$REMOTE_DEPLOY_SCRIPT" "$DEPLOY_SHA" "$pm2_app" "$public_url" \
            "$REMOTE_FRONTEND_ARTIFACT" "$FRONTEND_ARTIFACT_SHA256" "$REMOTE_DEPLOY_SCRIPT"

          ssh \
            -i "$HOME/.ssh/digitalocean_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -p "$port" \
            "$DO_USER@$DO_HOST" \
            "$remote_command"

      - name: Publish deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### DigitalOcean production deployment"
            echo ""
            echo "- Commit: \`${DEPLOY_SHA:0:12}\`"
            echo "- App directory: \`${APP_DIR:-/var/www/CRMANANTTATTVA}\`"
            echo "- PM2 process: \`${PM2_APP_NAME:-crm-backend}\`"
            echo "- URL: ${PUBLIC_URL:-https://crmananttattva.com}"
            echo "- Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
