name: Vercel Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Vercel environment to deploy
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy CRM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
      VERCEL_CLI_VERSION: 54.17.3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Detect Vercel deployment mode
        id: deployment_config
        shell: bash
        run: |
          ready=true
          for secret_name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!secret_name}" ]; then
              echo "::warning::$secret_name is not configured; using the native Vercel Git integration."
              ready=false
            fi
          done
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: Pull Vercel project settings
        if: steps.deployment_config.outputs.ready == 'true'
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=${DEPLOY_ENV} --token=${VERCEL_TOKEN}

      - name: Build Vercel output
        if: steps.deployment_config.outputs.ready == 'true'
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build ${{ env.DEPLOY_ENV == 'production' && '--prod' || '' }} --token=${VERCEL_TOKEN}

      - name: Deploy prebuilt output
        if: steps.deployment_config.outputs.ready == 'true'
        id: deploy
        shell: bash
        run: |
          deploy_args=(--prebuilt --token="${VERCEL_TOKEN}")
          if [ "${DEPLOY_ENV}" = "production" ]; then
            deploy_args+=(--prod)
          fi
          deployment_url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy "${deploy_args[@]}")"
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Verify native Vercel Git deployment
        if: steps.deployment_config.outputs.ready != 'true'
        shell: bash
        run: |
          production_url="https://crmananttattva.vercel.app"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 20 "$production_url" > /dev/null; then
              echo "Native Vercel production deployment is reachable: $production_url"
              exit 0
            fi
            echo "Waiting for native Vercel deployment (attempt ${attempt}/12)..."
            sleep 10
          done
          echo "::error::Native Vercel production deployment did not become reachable."
          exit 1

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "### Vercel deployment"
            echo ""
            echo "- Environment: \`${DEPLOY_ENV}\`"
            if [ "${{ steps.deployment_config.outputs.ready }}" = "true" ]; then
              echo "- Mode: GitHub Actions direct deployment"
              echo "- URL: ${{ steps.deploy.outputs.url }}"
            else
              echo "- Mode: Native Vercel Git integration"
              echo "- URL: https://crmananttattva.vercel.app"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
