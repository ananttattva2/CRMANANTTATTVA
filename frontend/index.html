<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>CRM</title>
    <!-- Fonts enhance the page after layout styles load; they never block them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Nunito:wght@400;500;600;700;800&amp;family=Roboto:wght@400;500;600;700&amp;display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Nunito:wght@400;500;600;700;800&amp;family=Roboto:wght@400;500;600;700&amp;display=swap" /></noscript>
    <script>
      (function () {
        var ignoredMessages = [
          'A listener indicated an asynchronous response by returning true, but the message channel closed before a response was received',
          'A listener indicated an asynchronous response by returning true, but the message channel closed before a response was received.'
        ];

        function getMessage(reason) {
          if (!reason) return '';
          return String(reason.message || reason);
        }

        function shouldIgnore(reason) {
          var message = getMessage(reason);
          return ignoredMessages.some(function (ignoredMessage) {
            return message.indexOf(ignoredMessage) !== -1;
          });
        }

        window.__CRM_SHOULD_IGNORE_BROWSER_NOISE__ = shouldIgnore;
        function recoverStaleAsset() {
          var retryKey = 'crm_asset_recovery_at';
          var lastAttempt = Number(sessionStorage.getItem(retryKey) || 0);
          if (Date.now() - lastAttempt < 60000) return;
          sessionStorage.setItem(retryKey, String(Date.now()));
          var url = new URL(window.location.href);
          url.searchParams.set('_asset_refresh', String(Date.now()));
          window.location.replace(url.toString());
        }

        window.addEventListener('unhandledrejection', function (event) {
          if (shouldIgnore(event.reason)) {
            event.preventDefault();
            return;
          }
          var message = getMessage(event.reason);
          if (/failed to fetch dynamically imported module|importing a module script failed|chunkloaderror/i.test(message)) {
            event.preventDefault();
            recoverStaleAsset();
          }
        }, true);

        window.addEventListener('error', function (event) {
          var target = event.target;
          var assetUrl = target && (target.src || target.href) || '';
          if (/\/assets\/[^/]+\.(?:css|js)(?:\?.*)?$/i.test(assetUrl) || /failed to fetch dynamically imported module|module script.*mime type/i.test(String(event.message || ''))) {
            recoverStaleAsset();
          }
        }, true);

        window.addEventListener('vite:preloadError', function (event) {
          event.preventDefault();
          recoverStaleAsset();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
